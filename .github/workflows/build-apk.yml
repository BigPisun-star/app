name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Gradle / Capacitor 6) ────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js 20 ────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install npm dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 5. Build Vite / React ─────────────────────────────────────────────────
      - name: Build React app
        run: npm run build

      # ── 6. Add Android platform if not committed ──────────────────────────────
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ── 7. Sync web assets into Android ──────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 8. Android SDK (includes build-tools, platform-tools) ─────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 9. Accept licenses ────────────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── 10. Gradlew permissions ───────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 11. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 12. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: biotracker-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 13. Print download instructions ──────────────────────────────────────
      - name: Build complete
        run: |
          echo "✅ APK собран успешно"
          echo "📱 Скачай артефакт: Actions → этот run → Artifacts → biotracker-debug-${{ github.run_number }}"
